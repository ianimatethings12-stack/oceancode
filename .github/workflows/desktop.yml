name: desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (for example v0.1.3), or empty to only upload workflow artifacts"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: --win
            pattern: "dist/*.exe"
            release_pattern: "dist/*.exe dist/*.exe.blockmap dist/latest.yml"
          - name: macos
            os: macos-latest
            command: --mac --arm64
            pattern: "dist/*.dmg"
            release_pattern: "dist/*.dmg dist/*.zip dist/latest-mac.yml"
          - name: linux
            os: ubuntu-latest
            command: --linux
            pattern: "dist/*.AppImage"
            release_pattern: "dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux.yml"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: bun install

      - name: Build desktop
        env:
          OCEANCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        working-directory: packages/desktop
        run: |
          bun run prebuild
          bun run build
          bunx electron-builder ${{ matrix.command }} --config electron-builder.config.ts --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: oceancode-desktop-${{ matrix.name }}
          path: packages/desktop/${{ matrix.pattern }}
          if-no-files-found: error

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for pattern in ${{ matrix.release_pattern }}; do
            files+=(packages/desktop/$pattern)
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "no packages matched" >&2
            exit 1
          fi
          gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber
